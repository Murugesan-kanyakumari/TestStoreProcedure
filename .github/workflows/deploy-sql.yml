name: Deploy SQL Changes

on:
  push:
    branches:
      - main
    paths:
      - 'database/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get list of changed SQL files
        id: changed
        shell: powershell
        run: |
          $BEFORE_SHA = "${{ github.event.before }}"
          if ([string]::IsNullOrEmpty($BEFORE_SHA) -or $BEFORE_SHA -eq "0000000000000000000000000000000000000000") {
            $BEFORE_SHA = git rev-parse HEAD^
          }

          Write-Host "Comparing $BEFORE_SHA to ${{ github.sha }}"
          $changed = git diff --name-only $BEFORE_SHA ${{ github.sha }}

          Write-Host "----- Files changed in this push -----"
          $changed | ForEach-Object { Write-Host $_ }
          Write-Host "---------------------------------------"

          $tables = ($changed | Where-Object { $_ -match '^database/Tables/.*\.sql$' }) -join ' '
          $sps = ($changed | Where-Object { $_ -match '^database/StoredProcedures/.*\.sql$' }) -join ' '

          Add-Content -Path $env:GITHUB_OUTPUT -Value "tables=$tables"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "sps=$sps"

      - name: Deploy changed Table scripts
        if: steps.changed.outputs.tables != ''
        shell: cmd
        run: |
          for %%f in (${{ steps.changed.outputs.tables }}) do (
            sqlcmd -S localhost\SQLEXPRESS -d Test_Store_Procedure -i "%%f" -E -C
          )

      - name: Deploy changed Stored Procedure scripts
        if: steps.changed.outputs.sps != ''
        shell: cmd
        run: |
          for %%f in (${{ steps.changed.outputs.sps }}) do (
            sqlcmd -S localhost\SQLEXPRESS -d Test_Store_Procedure -i "%%f" -E -C
          )
